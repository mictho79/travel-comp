<!-- File: index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Google Search Console verification -->
  <meta name="google-site-verification" content="lBEIuS-fSyE4xe_CNG8TaV0_-NneRXKzxq7G8EycSwI" />

  <!-- Primary SEO -->
  <title>Travel Budget Comparison</title>
  <meta name="description" content="Compare estimated travel budgets between countries based on national averages." />

  <!-- Canonical (OK with pages.dev) -->
  <link rel="canonical" href="https://travel-comp.pages.dev/" />

  <!-- Favicons (create these files in /assets/meta/) -->
  <link rel="icon" href="/assets/meta/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/meta/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/meta/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/meta/apple-touch-icon.png">
  <link rel="manifest" href="/assets/meta/site.webmanifest">
  <meta name="theme-color" content="#140c1c" />

  <!-- Open Graph (social share) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Travel Budget Comparison" />
  <meta property="og:title" content="Travel Budget Comparison" />
  <meta property="og:description" content="Compare estimated travel budgets between countries based on national averages." />
  <meta property="og:url" content="https://travel-comp.pages.dev/" />
  <!-- Optional: add a social preview image -->
  <!-- <meta property="og:image" content="https://travel-comp.pages.dev/assets/meta/og-image.png" /> -->

  <!-- Twitter cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Travel Budget Comparison" />
  <meta name="twitter:description" content="Compare estimated travel budgets between countries based on national averages." />
  <!-- Optional: same image as OG -->
  <!-- <meta name="twitter:image" content="https://travel-comp.pages.dev/assets/meta/og-image.png" /> -->

  <!-- Structured data: Website (helps Google understand your site name) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Travel Budget Comparison",
    "url": "https://travel-comp.pages.dev/"
  }
  </script>

  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <main class="container">
    <header class="header">
      <div style="display:flex; gap:12px; align-items:center; justify-content:space-between;">
        <h1 data-i18n="title">Travel Budget Comparison</h1>

        <select id="langSelect"
          style="padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,0.14);background:rgba(0,0,0,0.25);color:rgba(255,255,255,0.95);">
          <option value="en">EN</option>
          <option value="fr">FR</option>
          <option value="es">ES</option>
          <option value="pt">PT</option>
        </select>
      </div>

      <p data-i18n="subtitle">Fast estimates based on national averages (shown in EUR).</p>

      <p>
        <a href="/countries/" class="navlink" data-i18n="browseAll">Browse all countries →</a>
      </p>
    </header>

    <section class="card">
      <div class="grid">
        <label>
          <span data-i18n="countryA">Country A</span>
          <select id="countryA"></select>
        </label>

        <label>
          <span data-i18n="countryB">Country B</span>
          <select id="countryB"></select>
        </label>

        <label>
          <span data-i18n="tripLength">Trip length (days)</span>
          <input id="days" type="range" min="3" max="30" value="14" />
          <div class="hint"><span id="daysValue">14</span> <span data-i18n="days">days</span></div>
        </label>

        <label>
          <span data-i18n="travelStyle">Travel style</span>
          <select id="profile">
            <option value="backpacker" data-i18n="backpacker">Backpacker</option>
            <option value="comfort" selected data-i18n="comfort">Comfort</option>
            <option value="luxury" data-i18n="luxury">Luxury</option>
          </select>
        </label>

        <label class="checkbox">
          <input id="includeFlight" type="checkbox" checked />
          <span data-i18n="includeFlight">Include round-trip flight (from Europe)</span>
        </label>
      </div>
    </section>

    <section class="card" id="resultsCard" hidden>
      <h2 data-i18n="results">Results</h2>

      <div class="results-grid">
        <div class="result">
          <div class="label" id="nameA"></div>
          <div class="country-card">
            <div class="country-frame">
              <img id="imgA" class="country-art" alt="" />
            </div>
          </div>
          <div class="big" id="totalA"></div>
          <div class="sub">
            <span id="perDayA"></span> <span data-i18n="perDay">/ day</span> ·
            <span data-i18n="flightLabel">Flight</span>: <span id="flightA"></span>
          </div>
        </div>

        <div class="result">
          <div class="label" id="nameB"></div>
          <div class="country-card">
            <div class="country-frame">
              <img id="imgB" class="country-art" alt="" />
            </div>
          </div>
          <div class="big" id="totalB"></div>
          <div class="sub">
            <span id="perDayB"></span> <span data-i18n="perDay">/ day</span> ·
            <span data-i18n="flightLabel">Flight</span>: <span id="flightB"></span>
          </div>
        </div>
      </div>

      <div class="compare" id="compareBox"></div>

      <div class="notes">
        <h3 data-i18n="importantNotes">Important notes</h3>
        <div class="notesGrid">
          <div>
            <strong id="notesTitleA"></strong>
            <ul id="notesA"></ul>
          </div>
          <div>
            <strong id="notesTitleB"></strong>
            <ul id="notesB"></ul>
          </div>
        </div>
        <p class="disclaimer" data-i18n="disclaimer">
          Estimates are national averages. Actual costs vary a lot by city, season, and travel habits.
        </p>
      </div>
    </section>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
