<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Travel Budget Comparison</title>
  <meta name="description" content="Compare estimated travel budgets between countries based on national averages." />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Travel Budget Comparison</h1>
      <p>Fast estimates based on national averages (shown in EUR).</p>
      <p>
  <a href="/countries/" class="navlink">Browse all countries →</a>
</p>
    </header>

    <section class="card">
      <div class="grid">
        <label>
          Country A
          <select id="countryA"></select>
        </label>

        <label>
          Country B
          <select id="countryB"></select>
        </label>

        <label>
          Trip length (days)
          <input id="days" type="range" min="3" max="30" value="14" />
          <div class="hint"><span id="daysValue">14</span> days</div>
        </label>

        <label>
          Travel style
          <select id="profile">
            <option value="backpacker">Backpacker</option>
            <option value="comfort" selected>Comfort</option>
            <option value="luxury">Luxury</option>
          </select>
        </label>

        <label class="checkbox">
          <input id="includeFlight" type="checkbox" checked />
          Include round-trip flight (from Europe)
        </label>
      </div>
    </section>

    <section class="card" id="resultsCard" hidden>
      <h2>Results</h2>

      <div class="results-grid">

        <!-- COUNTRY A -->
        <div class="result">
          <div class="label" id="nameA"></div>

          <div class="country-card">
            <div class="country-frame">
              <img id="imgA" class="country-art" alt="" />
            </div>
          </div>

          <div class="big" id="totalA"></div>
          <div class="sub">
            <span id="perDayA"></span> / day · Flight: <span id="flightA"></span>
          </div>
        </div>

        <!-- COUNTRY B -->
        <div class="result">
          <div class="label" id="nameB"></div>

          <div class="country-card">
            <div class="country-frame">
              <img id="imgB" class="country-art" alt="" />
            </div>
          </div>

          <div class="big" id="totalB"></div>
          <div class="sub">
            <span id="perDayB"></span> / day · Flight: <span id="flightB"></span>
          </div>
        </div>

      </div>

      <div class="compare" id="compareBox"></div>

      <div class="notes">
        <h3>Important notes</h3>
        <div class="notesGrid">
          <div>
            <strong id="notesTitleA"></strong>
            <ul id="notesA"></ul>
          </div>
          <div>
            <strong id="notesTitleB"></strong>
            <ul id="notesB"></ul>
          </div>
        </div>
        <p class="disclaimer">
          Estimates are national averages. Actual costs vary a lot by city, season, and travel habits.
        </p>
      </div>
    </section>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
